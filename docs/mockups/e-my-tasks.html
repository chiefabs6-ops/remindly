<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tether — App mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/*
  Mockup E — Tether, whole app. Design exploration only; not wired to the app.
  Keeps the app's framed-sheet shell, Inter, the teal "today" accent and red-for-overdue-only.
  Dark tokens move from neutral black to a cool charcoal (a 2-4% blue lean, not navy).
  Depth = one tone step per layer + a 1px top highlight on the sheet. No glows, no gradients.
  Pages are hash routes: #/overview #/inbox #/tasks #/task/:id #/calendar #/notes #/projects/:id #/settings
*/
:root{
  --ground:#0a0c0f; --surface:#111418; --raised:#171b20; --active:#1f242b; --hover:#151920;
  --border:#232830; --rule:#1a1e24; --control:#353c46;
  --text:#eef1f4; --muted:#aab2bc; --faint:#8b939d;
  --today:#5fb3c9; --today-bg:#12272e; --today-ink:#9fd6e3;
  --neg:#ec6a80; --neg-bg:#2c1820; --neg-ink:#f39aaa;
  --warn:#f0b45e; --warn-bg:#2a2012; --warn-ink:#f3c98a;
  --pos:#4cc489; --pos-bg:#14271d;
  --claude:#d9a27c;  /* Claude's mark: a warm clay, used only on the small spark glyph */
  --t-blue-bg:#15233a;--t-blue:#a8c8f5; --t-amber-bg:#2a2012;--t-amber:#f0c36d;
  --t-green-bg:#15281d;--t-green:#9fd9b3; --t-teal-bg:#10282a;--t-teal:#8fd9d2;
  --t-rose-bg:#2c1520;--t-rose:#f3a6bb; --t-slate-bg:#1d2430;--t-slate:#c5cfdb;
  --r-sheet:14px; --r-card:8px; --r-ctl:6px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font:14px/20px Inter,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:14px;height:14px}
svg.i.xs{width:12px;height:12px}
:focus-visible{outline:2px solid var(--today);outline-offset:2px;border-radius:4px}
::selection{background:var(--today-bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--faint)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:52px minmax(0,1fr);height:100vh}
.side{grid-row:1/3;display:flex;flex-direction:column;padding:12px 10px;gap:1px;min-height:0}
.brand{display:flex;align-items:center;gap:9px;height:36px;padding:0 10px;margin-bottom:10px;font-weight:600;letter-spacing:-.01em}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:var(--r-ctl);color:var(--muted);text-decoration:none;transition:background .12s,color .12s}
.nav:hover{background:var(--hover);color:var(--text)}
.nav.on{background:var(--active);color:var(--text);font-weight:500}
.nav .ct{margin-left:auto;font-size:12px;color:var(--faint);font-weight:400}
.nav .ct.new{color:var(--today-ink);background:var(--today-bg);border-radius:10px;padding:0 6px;line-height:18px}
.side h3{display:flex;align-items:center;margin:22px 10px 6px;font:400 12px Inter;color:var(--faint)}
.side h3 a{margin-left:auto;color:var(--faint);display:flex}.side h3 a:hover{color:var(--text)}
.dot{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
.side .foot{margin-top:auto;padding-top:12px}
.top{display:flex;align-items:center;gap:12px;padding:0 16px 0 4px;min-width:0}
.search{position:relative;width:100%;max-width:440px}
.search input{width:100%;height:34px;border-radius:var(--r-ctl);border:1px solid var(--border);background:var(--surface);padding:0 64px 0 34px;font-size:13px;outline:none;transition:border-color .12s}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--control)}
.search .i{position:absolute;left:11px;top:9px;color:var(--faint)}
kbd{font:500 11px Inter;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--raised)}
.search kbd{position:absolute;right:9px;top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--control);background:var(--surface);font-weight:500;font-size:13px;white-space:nowrap;text-decoration:none;transition:background .12s,transform .08s,border-color .12s}
.btn:hover{background:var(--raised)}
.btn:active{transform:translateY(1px)}
.btn.p{background:var(--text);color:#0a0c0f;border-color:var(--text)}
.btn.p:hover{background:#fff}
.btn.g{border-color:transparent;background:transparent}
.btn.g:hover{background:var(--active)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.ic{width:32px;padding:0;justify-content:center}
.btn.sm.ic{width:28px}
.btn.danger{color:var(--neg)}
.top .btn.p{margin-left:auto}
.tbrand,.tgear{display:none}

.sheet{position:relative;margin:0 8px 8px 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sheet);box-shadow:inset 0 1px 0 rgba(255,255,255,.035);display:grid;grid-template-columns:minmax(0,1fr) 404px;overflow:hidden;min-height:0}
.sheet.closed{grid-template-columns:minmax(0,1fr) 0}
.sheet.plain{display:block;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--control) transparent}

/* ---------- shared page parts ---------- */
.pg{padding:20px 28px 48px}
.pg-h{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font:600 22px/28px Inter;letter-spacing:-.015em}
.summary{color:var(--muted);font-size:13px;margin-top:2px}
.summary b{font-weight:500;color:var(--text)}
.summary .od{color:var(--neg)}
.pg-h .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.card{border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);min-width:0}
.card-h{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;font-weight:600;font-size:13px;border-bottom:1px solid var(--rule)}
.card-h .c{font-weight:400;color:var(--faint)}
.card-h .a{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted);text-decoration:none;height:26px;padding:0 8px;border-radius:5px;display:flex;align-items:center;gap:5px}
.card-h .a:hover{background:var(--active);color:var(--text)}
.card-b{padding:6px 8px 8px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs button,.tabs a{position:relative;display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}
.tabs button:hover,.tabs a:hover{color:var(--text)}
.tabs .n{font-size:12px;color:var(--faint);font-weight:400}
.tabs .od .n,.tabs button.od .n{color:var(--neg)}
.tabs [aria-selected=true]{color:var(--text)}
.tabs [aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--text)}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:500;background:var(--active);color:var(--muted);white-space:nowrap}
.pill.td{background:var(--today-bg);color:var(--today-ink)}
.pill.od{background:var(--neg-bg);color:var(--neg-ink)}
.pill.wn{background:var(--warn-bg);color:var(--warn-ink)}
.pill.ok{background:var(--pos-bg);color:var(--pos)}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-decoration:none}
.bar{width:120px;height:4px;border-radius:2px;background:var(--active);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--today);border-radius:2px;transition:width .3s}
.bar.grey i{background:var(--muted)}
.dayprog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.claude-g{color:var(--claude);display:inline-flex}
.split{display:grid;grid-template-columns:320px minmax(0,1fr);height:100%;min-height:0}
.split > .lp{border-right:1px solid var(--border);overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--control) transparent}
.split > .rp{overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--control) transparent}
.lp-h{padding:20px 16px 12px;position:sticky;top:0;background:var(--surface);z-index:2}
.li{display:block;padding:10px 12px;margin:0 8px 2px;border-radius:var(--r-ctl);text-decoration:none;color:var(--text)}
.li:hover{background:var(--hover)}
.li.on{background:var(--active)}
.li .t{display:flex;align-items:center;gap:8px;font-weight:500}
.li .t span:first-of-type{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:12px;color:var(--faint)}
.li .m .r{margin-left:auto}
.field{height:34px;width:100%;border-radius:var(--r-ctl);border:1px solid var(--border);background:var(--raised);padding:0 10px;font-size:13px;outline:none}
.field:focus{border-color:var(--control)}
.field::placeholder{color:var(--faint)}
select.field{width:auto;padding-right:28px}

/* ---------- my tasks: list column ---------- */
.listcol{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{padding:20px 28px 0}
.titlerow{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.titlerow .dayprog{margin-left:auto}
.views{margin-top:16px}
.tools{display:flex;align-items:center;gap:8px;padding:12px 28px 10px}
.qa{position:relative;flex:1;min-width:0}
.qa input{width:100%;height:36px;border-radius:var(--r-ctl);border:1px solid var(--border);background:var(--raised);padding:0 12px 0 36px;font-size:13.5px;outline:none;transition:border-color .12s,background .12s}
.qa input::placeholder{color:var(--faint)}
.qa input:focus{border-color:var(--control);background:var(--surface)}
.qa > .i{position:absolute;left:11px;top:10px;color:var(--faint)}
.parse{position:absolute;right:8px;top:7px;display:flex;gap:4px}
.menu-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:var(--r-ctl);font-size:12.5px;color:var(--muted);border:1px solid transparent;white-space:nowrap}
.menu-btn:hover{background:var(--active);color:var(--text)}
.menu-btn b{font-weight:500;color:var(--text)}
.scroll{flex:1;overflow-y:auto;padding:0 20px 80px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--control) transparent}

/* Claude suggestions tray */
.tray{margin:4px 8px 8px;border:1px dashed var(--control);border-radius:var(--r-card);background:var(--raised)}
.tray-h{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:9px 12px;font-size:13px;color:var(--muted);text-align:left}
.tray-h b{color:var(--text);font-weight:500}
.tray-h .chev{margin-left:auto;transition:transform .15s}
.tray.open .tray-h .chev{transform:rotate(180deg)}
.tray-h .peek{margin-left:auto;font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tray.open .tray-h .peek{display:none}
.sugg{display:none;padding:0 6px 6px}
.tray.open .sugg{display:block}
.sg{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:10px 8px;border-top:1px solid var(--border)}
.sg .ring{width:16px;height:16px;border-radius:50%;border:1.5px dashed var(--faint);margin-top:2px}
.sg .t{font-weight:500}
.sg .why{color:var(--muted);font-size:12.5px;margin-top:2px}
.sg .why .q{color:var(--text)}
.sg .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;align-items:center}
.sg .acts{display:flex;gap:4px;align-items:flex-start}

/* groups and rows */
.grp{margin-top:6px}
.gh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--text)}
.gh .tog{display:flex;align-items:center;gap:6px}
.gh .tog .i{color:var(--faint);transition:transform .15s}
.grp.shut .gh .tog .i{transform:rotate(-90deg)}
.grp.shut .rows{display:none}
.gh .c{font-weight:400;color:var(--faint)}
.gh.od{color:var(--neg)}
.gh .sub{font-weight:400;color:var(--faint);margin-left:2px}
.gh .ga{margin-left:auto;font-weight:500;color:var(--muted);font-size:12px;height:26px;padding:0 8px;border-radius:5px}
.gh .ga:hover{background:var(--active);color:var(--text)}
.row{position:relative;display:grid;grid-template-columns:14px 20px minmax(0,1fr) auto 150px 104px 22px;align-items:center;gap:10px;min-height:44px;padding:0 8px 0 0;border-radius:var(--r-ctl);cursor:default;transition:background .1s}
.row + .row{box-shadow:0 -1px 0 var(--rule)}
.row:hover{background:var(--hover);box-shadow:none}
.row:hover + .row{box-shadow:none}
.row.sel{background:var(--active);box-shadow:none}
.row.sel + .row{box-shadow:none}
.row.kb{outline:1px solid var(--control);outline-offset:-1px}
.grip{opacity:0;color:var(--faint);cursor:grab;display:flex;justify-content:center}
.row:hover .grip{opacity:1}
.nodrag .grip{visibility:hidden}
.row.dragging{opacity:.4}
.row.over{box-shadow:inset 0 2px 0 var(--today)!important}
.ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--control);display:grid;place-items:center;transition:border-color .12s,background .12s;flex:none}
.ck:hover{border-color:var(--muted)}
.ck svg{opacity:0;width:11px;height:11px;stroke:#0a0c0f;stroke-width:2.6}
.ck:hover svg{opacity:.35;stroke:var(--muted)}
.ck.p3{border-color:var(--warn)}
.ck.on{background:var(--muted);border-color:var(--muted)}
.ck.on svg{opacity:1;stroke:#0a0c0f}
.row.done .ck{background:var(--muted);border-color:var(--muted)}
.row.done .ck svg{opacity:1;stroke:#0a0c0f}
.tt{display:flex;align-items:center;gap:8px;min-width:0;padding:12px 0;text-align:left}
.tt .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .name{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--faint)}
.marks{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px}
.mk{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.mk.rem.on{color:var(--muted)}
.mk.rem.late{color:var(--warn)}
.sub-ring{width:12px;height:12px}
.pcell{min-width:0;display:flex}
.due{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.due.od{color:var(--neg);font-weight:500}
.due.td{color:var(--today);font-weight:500}
.due.none{color:var(--faint)}
.pri{display:flex;align-items:flex-end;gap:2px;height:12px;justify-content:center}
.pri i{width:3px;border-radius:1px;background:var(--control)}
.pri i:nth-child(1){height:5px}.pri i:nth-child(2){height:8px}.pri i:nth-child(3){height:11px}
.pri.p1 i:nth-child(1){background:var(--muted)}
.pri.p2 i:nth-child(-n+2){background:var(--muted)}
.pri.p3 i{background:var(--warn)}
/* hover actions sit over the marks cell (marks are secondary; project, due and priority stay visible) */
.hov{position:absolute;right:314px;top:50%;transform:translateY(-50%);display:none;gap:2px;background:var(--hover);padding-left:8px}
.row.sel .hov{background:var(--active)}
.row:hover .hov{display:flex}
.hov button{width:28px;height:28px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.hov button:hover{background:var(--control);color:var(--text)}
.empty{margin:40px auto;max-width:340px;text-align:center;color:var(--muted)}
.empty h2{font:600 15px Inter;color:var(--text);margin:12px 0 4px}
.empty .ok{width:40px;height:40px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:var(--pos-bg);color:var(--pos)}
.foot-hint{display:flex;gap:14px;flex-wrap:wrap;padding:20px 8px 0;color:var(--faint);font-size:12px}

/* ---------- quick panel and full task page (shared parts) ---------- */
.detail{border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface);overflow:hidden}
.sheet.closed .detail{border:0}
.dbar{display:flex;align-items:center;gap:4px;height:52px;padding:0 12px 0 20px;border-bottom:1px solid var(--rule);flex:none}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);min-width:0;white-space:nowrap;text-decoration:none}
.crumb:hover{color:var(--text)}
.dbar .sp{flex:1}
.dbody{flex:1;overflow-y:auto;padding:18px 20px 24px;scrollbar-width:thin;scrollbar-color:var(--control) transparent}
.dfoot{flex:none;border-top:1px solid var(--rule);padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--faint)}
.dfoot .btn{margin-left:auto}
.dtitle{display:flex;gap:12px;align-items:flex-start}
.dtitle .ck{margin-top:4px;width:20px;height:20px}
.dtitle h2{flex:1;margin:0;font:600 18px/26px Inter;letter-spacing:-.01em;outline:none;border-radius:4px;padding:0 4px;margin-left:-4px}
.dtitle h2:hover{background:var(--hover)}
.dtitle h2:focus{background:var(--raised);box-shadow:0 0 0 1px var(--control)}
.done-t h2{color:var(--faint);text-decoration:line-through}
.src{display:flex;align-items:center;gap:6px;margin:8px 0 0 32px;font-size:12px;color:var(--faint)}
.desc{margin:14px 0 0;padding:8px 10px;margin-left:22px;border-radius:6px;color:var(--text);line-height:21px;outline:none;min-height:38px}
.desc:hover{background:var(--hover)}
.desc:focus{background:var(--raised);box-shadow:0 0 0 1px var(--control)}
.desc:empty::before{content:"Add a description";color:var(--faint)}
.props{margin:16px 0 0;display:grid;grid-template-columns:96px minmax(0,1fr);row-gap:2px;font-size:13px}
.props dt{color:var(--faint);display:flex;align-items:center;gap:7px;min-height:34px}
.props dd{margin:0;display:flex;align-items:center;min-width:0}
.val{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:0 8px;margin-left:-8px;border-radius:6px;max-width:100%;text-align:left}
.val:hover{background:var(--active)}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--border);border-radius:7px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{height:24px;padding:0 9px;border-radius:5px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed=true]{background:var(--active);color:var(--text);font-weight:500}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:center;gap:8px;height:28px;font-size:12.5px;font-weight:600}
.sec-h .c{font-weight:400;color:var(--faint)}
.sec-h .a{margin-left:auto;font-size:12px;font-weight:500;color:var(--muted);padding:0 6px;height:24px;border-radius:5px;display:flex;align-items:center;gap:5px;text-decoration:none}
.sec-h .a:hover{background:var(--active);color:var(--text)}
.remcard{border:1px solid var(--border);border-radius:var(--r-card);background:var(--raised);padding:12px}
.remline{display:flex;align-items:center;gap:10px;font-size:13px}
.remline .when{font-weight:500}
.remline .sub{color:var(--faint);font-size:12px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.presets button{height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--border);font-size:12px;color:var(--muted);background:var(--surface)}
.presets button:hover{border-color:var(--control);color:var(--text)}
.presets button[aria-pressed=true]{border-color:var(--today);color:var(--today-ink);background:var(--today-bg)}
.sw{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px}
.sw .txt{flex:1}
.sw .txt small{display:block;color:var(--faint);font-size:12px}
.toggle{width:30px;height:18px;border-radius:9px;background:var(--control);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--text);transition:transform .15s}
.toggle[aria-checked=true]{background:var(--today)}
.toggle[aria-checked=true]::after{transform:translateX(12px);background:#0a0c0f}
.stl{list-style:none;margin:0;padding:0}
.st{display:flex;align-items:center;gap:10px;min-height:34px;border-radius:6px;padding:0 6px;margin:0 -6px}
.st:hover{background:var(--hover)}
.st .ck{width:16px;height:16px}
.st .ck svg{width:9px;height:9px}
.st.done .ck{background:var(--muted);border-color:var(--muted)}
.st.done .ck svg{opacity:1;stroke:#0a0c0f}
.st.done span{color:var(--faint);text-decoration:line-through}
.st .rm{margin-left:auto;opacity:0;color:var(--faint);display:flex}
.st:hover .rm{opacity:1}
.addst{display:flex;align-items:center;gap:10px;height:34px;color:var(--faint);padding:0 6px;margin:0 -6px}
.addst input{flex:1;background:none;border:0;outline:none;font-size:13.5px}
.addst input::placeholder{color:var(--faint)}
.sprog{flex:1;max-width:80px;height:3px;border-radius:2px;background:var(--active);overflow:hidden}
.sprog i{display:block;height:100%;background:var(--muted)}
.ctx{border-left:2px solid var(--claude);padding:2px 0 2px 12px;font-size:13px;line-height:20px;color:var(--text)}
.ctx p{margin:0 0 8px}
.ctx .lbl{color:var(--faint);font-size:12px;margin-bottom:2px}
.ctx ul{margin:0 0 8px;padding-left:18px}
.ctx code,.mono{font:12px/18px ui-monospace,Consolas,monospace;background:var(--active);border-radius:4px;padding:1px 5px}
.cap{background:var(--raised);border-radius:var(--r-card);padding:12px 14px}
.cap .h{display:flex;align-items:center;gap:7px;color:var(--faint);font-size:12px;margin-bottom:8px}
.cap blockquote{margin:0 0 8px;padding-left:12px;border-left:2px solid var(--today);line-height:21px;font-size:13px}
.cap a{font-size:12.5px;color:var(--muted)}
.links a{display:flex;align-items:center;gap:10px;min-height:34px;color:var(--text);text-decoration:none;font-size:13px;border-radius:6px;padding:0 6px;margin:0 -6px}
.links a:hover{background:var(--hover)}
.links a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links a small{margin-left:auto;color:var(--faint);font-size:12px;flex:none}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;margin-top:6px;border:1px dashed var(--control);border-radius:var(--r-card);color:var(--faint);font-size:12.5px}
.notes{width:100%;min-height:68px;resize:vertical;background:var(--raised);border:1px solid var(--border);border-radius:var(--r-card);padding:10px 12px;font-size:13px;line-height:20px;outline:none}
.notes:focus{border-color:var(--control)}
.notes::placeholder{color:var(--faint)}
.hist{list-style:none;margin:0;padding:0;font-size:12.5px}
.hist li{display:grid;grid-template-columns:92px 1fr;gap:8px;padding:6px 0;color:var(--muted)}
.hist time{color:var(--faint)}
.hist li.cm span{color:var(--text)}
.stamp{margin-top:18px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;color:var(--faint);display:flex;gap:16px;flex-wrap:wrap}
.dempty{flex:1;display:grid;place-items:center;text-align:center;color:var(--faint);padding:24px;font-size:13px}

/* full task page */
.tp-bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;height:52px;padding:0 16px 0 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.tp-bar .crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.tp-bar .crumbs b{font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-bar .acts{margin-left:auto;display:flex;gap:6px;flex:none}
.tp{display:grid;grid-template-columns:minmax(0,1fr) 384px;align-items:start}
.tp-head{grid-column:1/-1;padding:28px 40px 0;max-width:1100px}
.tp-head .dtitle h2{font-size:24px;line-height:32px}
.tp-head .dtitle .ck{width:22px;height:22px;margin-top:5px}
.tp-head .src{margin-left:34px}
.tp-main{padding:8px 40px 48px;min-width:0;max-width:820px}
.tp-main .desc{margin-left:24px;font-size:14.5px;line-height:23px}
.tp-side{position:sticky;top:52px;margin:20px 20px 24px 0;padding:16px 18px;border:1px solid var(--border);border-radius:var(--r-card);background:var(--raised)}
.tp-side .props{margin-top:4px}
.tp-side .remcard{background:var(--surface)}
.tp-side .qa2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.tp-side .qa2 .btn{justify-content:center}
.comment{display:flex;gap:8px;margin-top:10px}

/* ---------- overview ---------- */
.ov{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.card .row{grid-template-columns:14px 20px minmax(0,1fr) auto 140px 100px 22px}
.card .row .hov{right:300px}
.row.np{grid-template-columns:14px 20px minmax(0,1fr) auto 100px 22px}
.row.np .pcell{display:none}
.row.np .hov{right:150px}
.repo .mono{white-space:nowrap}
.ov > div{display:flex;flex-direction:column;gap:16px;min-width:0}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.wd{padding:10px 12px 12px;min-height:132px;border-left:1px solid var(--rule);text-decoration:none;color:var(--text);display:block}
.wd:first-child{border-left:0}
.wd:hover{background:var(--hover)}
.wd .dn{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--faint)}
.wd .dn b{font-size:15px;font-weight:600;color:var(--text)}
.wd .dn .n{margin-left:auto}
.wd ul{list-style:none;margin:8px 0 0;padding:0;font-size:12px;line-height:16px}
.wd li{display:flex;gap:6px;align-items:baseline;margin-top:6px;color:var(--muted)}
.wd li .dot{width:6px;height:6px;margin-top:5px;transform:translateY(-1px)}
.wd li span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wd .more{color:var(--faint);margin-top:6px;font-size:12px}
.tl{list-style:none;margin:0;padding:4px 8px}
.tl li{display:grid;grid-template-columns:52px 14px minmax(0,1fr);gap:8px;align-items:center;min-height:38px;font-size:13px}
.tl time{color:var(--muted);text-align:right}
.tl .pt{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--control);justify-self:center}
.tl li.past{color:var(--faint)}
.tl li.past .pt{background:var(--control)}
.tl li.next .pt{border-color:var(--today);background:var(--today)}
.tl li.next time{color:var(--today);font-weight:500}
.tl .nowline{grid-column:1/-1;height:1px;background:var(--today);opacity:.5;min-height:0}
.tl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 8px;border-radius:var(--r-ctl);text-decoration:none;color:var(--text)}
.wl:hover{background:var(--hover)}
.wl .big{font-size:20px;font-weight:600;width:28px;text-align:right}
.wl .tx{flex:1;min-width:0}
.wl .tx small{display:block;color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 36px 64px;gap:10px;align-items:center;min-height:36px;padding:0 8px;border-radius:var(--r-ctl);text-decoration:none;color:var(--text);font-size:13px}
.pl:hover{background:var(--hover)}
.pl .nm{display:flex;align-items:center;gap:8px;min-width:0}
.pl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .o{text-align:right;color:var(--muted)}
.pl .bar{width:64px}

/* ---------- inbox ---------- */
.ib{max-width:860px}
.capc{border:1px solid var(--border);border-radius:var(--r-card);padding:14px 16px;margin-top:12px}
.capc .hd{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--faint)}
.capc .hd .r{margin-left:auto}
.capc blockquote{margin:10px 0 0;padding-left:12px;border-left:2px solid var(--today);font-size:13px;line-height:21px;color:var(--muted)}
.prop-task{margin-top:12px;padding:12px;background:var(--raised);border-radius:var(--r-card)}
.prop-task .lb{font-size:12px;color:var(--faint);margin-bottom:6px}
.prop-task .tn{font-weight:600;font-size:14.5px}
.prop-task .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.prop-task .meta small{color:var(--faint);font-size:12px}
.dupe{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 10px;border-radius:6px;background:var(--warn-bg);color:var(--warn-ink);font-size:12.5px}
.dupe a{margin-left:auto;font-weight:500;color:var(--warn-ink)}
.capc .acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.note-line{display:flex;align-items:center;gap:8px;margin-top:20px;font-size:12.5px;color:var(--faint)}
.note-line a{color:var(--muted)}

/* ---------- calendar ---------- */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calbar .wk{font-size:14px;font-weight:600;margin:0 8px}
.cw{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.cw .dh{height:48px;padding:8px 10px;border-left:1px solid var(--rule);border-bottom:1px solid var(--border);font-size:12px;color:var(--faint)}
.cw .dh b{display:block;font-size:15px;color:var(--text);font-weight:600;line-height:18px}
.cw .dh.td b{color:var(--today)}
.cw .corner{border-bottom:1px solid var(--border)}
.cw .ad{min-height:64px;padding:6px;border-left:1px solid var(--rule);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:3px}
.cw .adl{border-bottom:1px solid var(--border);font-size:11px;color:var(--faint);padding:8px 6px 0;text-align:right}
.adchip{display:flex;align-items:center;gap:5px;height:22px;padding:0 6px;border-radius:5px;font-size:11.5px;background:var(--active);color:var(--text);overflow:hidden;white-space:nowrap;text-decoration:none}
.adchip span{overflow:hidden;text-overflow:ellipsis}
.adchip.od{background:var(--neg-bg);color:var(--neg-ink)}
.adchip.done{color:var(--faint);text-decoration:line-through}
.hrs{font-size:11px;color:var(--faint);text-align:right;padding-right:8px}
.hrs div{height:48px;transform:translateY(-7px)}
.dcol{position:relative;border-left:1px solid var(--rule);background:repeating-linear-gradient(to bottom,transparent 0 47px,var(--rule) 47px 48px)}
.dcol.td{background-color:rgba(95,179,201,.03)}
.ev{position:absolute;left:4px;right:4px;border-radius:6px;padding:4px 7px;font-size:11.5px;line-height:15px;overflow:hidden;text-decoration:none}
.ev b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small{color:inherit;opacity:.8}
.ev.meet{background:var(--active);color:var(--muted);border-left:2px solid var(--faint)}
.ev.task{background:var(--today-bg);color:var(--today-ink);border-left:2px solid var(--today)}
.ev.task.hi{background:var(--warn-bg);color:var(--warn-ink);border-left-color:var(--warn)}
.ev .bell{position:absolute;right:5px;top:5px}
.now{position:absolute;left:0;right:0;height:2px;background:var(--today);z-index:2}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--today)}
.agenda{display:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--faint);margin-left:auto}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- notes ---------- */
.ne{max-width:780px;padding:24px 40px 48px}
.ne h2{font:600 22px/30px Inter;letter-spacing:-.01em;margin:0;outline:none}
.ne .nm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;font-size:12.5px;color:var(--faint)}
.ne .body{margin-top:20px;font-size:14.5px;line-height:24px;outline:none}
.ne .body h3{font:600 14px Inter;margin:22px 0 6px}
.ne .body p{margin:0 0 10px}
.ne .body ul{margin:0 0 10px;padding-left:20px}
.ai-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;min-height:40px;border-top:1px solid var(--rule);font-size:13.5px}
.ai-row:first-of-type{border-top:0}
.ai-row small{color:var(--faint);font-size:12px}
.linked{display:flex;align-items:center;gap:10px;margin-top:24px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-card);font-size:13px;text-decoration:none;color:var(--text)}
.linked:hover{background:var(--hover)}
.linked small{margin-left:auto;color:var(--faint)}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.kinds button{height:26px;padding:0 9px;border-radius:13px;border:1px solid var(--border);font-size:12px;color:var(--muted)}
.kinds button[aria-pressed=true]{background:var(--active);color:var(--text);border-color:var(--control)}

/* ---------- projects ---------- */
.ph{padding:24px 32px 0}
.ph h1{display:flex;align-items:center;gap:10px}
.ph h1 .dot{width:12px;height:12px;border-radius:3px}
.ph p{margin:6px 0 0;color:var(--muted);max-width:640px}
.stats{display:flex;gap:28px;margin-top:16px;flex-wrap:wrap}
.stats div{font-size:12px;color:var(--faint)}
.stats b{display:block;font-size:20px;font-weight:600;color:var(--text);line-height:26px}
.stats b.od{color:var(--neg)}
.pbody{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;padding:20px 32px 48px;align-items:start}
.repo{display:flex;align-items:center;gap:8px;min-height:36px;font-size:13px}
.repo small{margin-left:auto;color:var(--faint);font-size:12px}

/* ---------- settings ---------- */
.set{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:20px 28px 48px}
.set nav{position:sticky;top:20px;display:flex;flex-direction:column;gap:1px;align-self:start}
.set nav a{height:32px;display:flex;align-items:center;padding:0 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-size:13px}
.set nav a:hover{background:var(--hover);color:var(--text)}
.set nav a.on{background:var(--active);color:var(--text);font-weight:500}
.set section{max-width:720px;margin-bottom:28px;scroll-margin-top:16px}
.set h2{font:600 15px Inter;margin:0 0 4px}
.set .lead{color:var(--faint);font-size:12.5px;margin:0 0 10px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;min-height:56px;padding:10px 0;border-top:1px solid var(--rule)}
.srow .l{font-size:13.5px}
.srow .l small{display:block;color:var(--faint);font-size:12px;margin-top:1px}
.srow .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.status i{width:7px;height:7px;border-radius:50%;background:var(--pos)}
.status.off i{background:var(--faint)}

/* ---------- floating: menus, toast ---------- */
.pop{position:fixed;z-index:50;min-width:220px;background:var(--raised);border:1px solid var(--control);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:6px;display:none}
.pop.show{display:block;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.pop .it{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:6px;font-size:13px;text-align:left;text-decoration:none;color:var(--text)}
.pop .it:hover,.pop .it.on{background:var(--active)}
.pop .it small{margin-left:auto;color:var(--faint);font-size:12px}
.pop hr{border:0;border-top:1px solid var(--border);margin:6px 2px}
.cal{padding:4px 6px 6px}
.cal .mh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:500;padding:2px 2px 6px}
.cal .mh button{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.cal .mh button:hover{background:var(--active)}
.cal .g{display:grid;grid-template-columns:repeat(7,30px);gap:1px;font-size:12px;text-align:center}
.cal .g span{color:var(--faint);height:22px;line-height:22px}
.cal .g button{height:28px;border-radius:6px;color:var(--text)}
.cal .g button:hover{background:var(--active)}
.cal .g button.past{color:var(--faint)}
.cal .g button.td{color:var(--today);font-weight:600}
.cal .g button.cur{background:var(--text);color:#0a0c0f;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;height:42px;padding:0 8px 0 14px;background:var(--raised);border:1px solid var(--control);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:13px;transition:opacity .18s,transform .18s;z-index:60;max-width:calc(100% - 32px);white-space:nowrap}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{font-weight:500;color:var(--today-ink);height:28px;padding:0 8px;border-radius:6px}
.toast button:hover{background:var(--active)}
.scrim{display:none}
.mnav{display:none}

/* ---------- responsive ---------- */
@media (max-width:1279px){
  .sheet,.sheet.closed{grid-template-columns:minmax(0,1fr)}
  .sheet.plain{display:block}
  .detail{position:absolute;top:0;right:0;bottom:0;width:404px;max-width:100%;z-index:20;box-shadow:-16px 0 40px rgba(0,0,0,.4);transform:translateX(0);transition:transform .2s ease}
  .sheet.closed .detail{transform:translateX(105%);box-shadow:none}
  .scrim{display:block;position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:15;transition:opacity .2s}
  .sheet.closed .scrim{opacity:0;pointer-events:none}
  .ov{grid-template-columns:minmax(0,1fr)}
  .tp{grid-template-columns:minmax(0,1fr)}
  .tp-side{position:static;margin:16px 40px 0;order:0}
  .tp-head{order:-1}
  .tp-main{order:1}
  .pbody{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1100px){ .row{grid-template-columns:14px 20px minmax(0,1fr) auto 128px 96px 22px} .hov{right:284px} }
@media (max-width:1023px){
  .app{grid-template-columns:1fr;grid-template-rows:52px minmax(0,1fr) 56px}
  .side{display:none}
  .top{padding:0 12px}
  .tbrand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .tgear{display:inline-flex}
  .sheet{margin:0;border-radius:0;border-left:0;border-right:0}
  .mnav{display:flex;padding:0 10px;border-top:1px solid var(--border);background:var(--surface)}
  .mnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;position:relative}
  .mnav a.on{color:var(--text)}
  .mnav a .b{position:absolute;top:7px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--today-bg);color:var(--today-ink);font-size:10.5px;line-height:16px;text-align:center}
  .detail{width:100%}
  .head{padding:16px 16px 0}.tools{padding:12px 16px 10px}.scroll{padding:0 8px 80px}
  .pg{padding:16px 16px 40px}
  .split{grid-template-columns:260px minmax(0,1fr)}
  .set{grid-template-columns:1fr;padding:16px}
  .set nav{position:static;flex-direction:row;overflow-x:auto}
  .tp-head{padding:20px 20px 0}.tp-main{padding:8px 20px 40px}.tp-side{margin:16px 20px 0}
  .ph{padding:20px 20px 0}.pbody{padding:16px 20px 40px}
  .ne{padding:20px 20px 40px}
}
@media (max-width:720px){
  .search{display:none}
  .titlerow .dayprog{margin-left:0;width:100%}
  .dayprog .bar{flex:1;width:auto}
  .tools .menu-btn .lbl{display:none}
  .row{grid-template-columns:20px minmax(0,1fr) 22px;grid-template-areas:"ck tt pr" ". mt mt";row-gap:0;padding:6px 8px 8px 8px;align-items:start}
  .row.np,.card .row{grid-template-columns:20px minmax(0,1fr) 22px}
  .row .grip,.row .hov{display:none!important}
  .row .ck{grid-area:ck;margin-top:11px}
  .row .tt{grid-area:tt;padding:10px 0 2px}
  .row .pri{grid-area:pr;margin-top:14px}
  .row .meta2{grid-area:mt;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row .marks,.row .pcell,.row .due{display:contents}

const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MO=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const short = d => WD[d.getDay()]+" "+d.getDate()+" "+MO[d.getMonth()];
const longDate = s => {const d=parse(s);return WD[d.getDay()]+" "+d.getDate()+" "+MO[d.getMonth()]};
function dueText(t){
  if(!t.due) return {txt:"No date",cls:"none"};
  const n=dayDiff(t.due), d=parse(t.due), tm=t.time?" "+t.time:"";
  if(t.done) return {txt:short(d),cls:""};
  if(n<0) return {txt:(n===-1?"Yesterday":short(d)),cls:"od",late:-n};
  if(n===0) return {txt:"Today"+tm,cls:"td"};
  if(n===1) return {txt:"Tomorrow"+tm,cls:""};
  if(n<7) return {txt:WD[d.getDay()]+" "+d.getDate()+tm,cls:""};
  return {txt:short(d)+tm,cls:""};
}
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ico = (id,c="s") => `<svg class="i ${c}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const PRI=["None","Low","Medium","High"];
const pchip = k => k?`<a class="chip" href="#/projects/${k}" style="${toneStyle(PROJECTS[k].tone)}">${PROJECTS[k].name}</a>`:`<span class="pill">No project</span>`;
const ckSvg = `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
const toMin = hm => {const [h,m]=hm.split(":").map(Number);return h*60+m};

const VIEWS = {
  all:{label:"All open", f:t=>isOpen(t)},
  today:{label:"Today", f:t=>isOpen(t)&&t.due&&dayDiff(t.due)<=0},
  upcoming:{label:"Upcoming", f:t=>isOpen(t)&&t.due&&dayDiff(t.due)>0},
  overdue:{label:"Overdue", f:t=>isOpen(t)&&t.due&&dayDiff(t.due)<0},
  done:{label:"Completed", f:t=>!!t.done},
};
function visible(){
  const q=S.q.trim().toLowerCase();
  return tasks.filter(t=>(VIEWS[S.view].f(t)||(t.linger&&S.view!=="done"))&&(!S.proj||t.project===S.proj)&&(!q||t.title.toLowerCase().includes(q)));
}
function dateBucket(t){
  if(t.linger&&S.view!=="done"){t={...t,done:null}}
  if(t.done){return t.done.startsWith("Today")?["d0","Completed today"]:t.done==="Yesterday"?["d1","Yesterday"]:["d2","Earlier this week"]}
  if(!t.due) return ["z","No date"];
  const n=dayDiff(t.due);
  if(n<0) return ["a","Overdue"];
  if(n===0) return ["b","Today"];
  if(n===1) return ["c","Tomorrow"];
  if(n<=5) return ["d","Rest of this week"];
  return ["e","Later"];
}
function groups(list){
  const g=new Map();
  for(const t of list){
    let k,l;
    if(S.group==="date"){[k,l]=dateBucket(t)}
    else if(S.group==="project"){k=t.project;l=PROJECTS[t.project].name}
    else {k=String(3-t.pri);l=t.pri?PRI[t.pri]+" priority":"No priority"}
    if(!g.has(k)) g.set(k,{k,l,items:[]});
    g.get(k).items.push(t);
  }
  const arr=[...g.values()].sort((a,b)=>a.k<b.k?-1:1);
  arr.forEach(x=>x.items.sort((a,b)=>S.group==="date"?(a.order-b.order):((a.due||"9")<(b.due||"9")?-1:1)));
  return arr;
}
function counts(){
  const o=tasks.filter(isOpen);
  return {all:o.length,today:o.filter(VIEWS.today.f).length,upcoming:o.filter(VIEWS.upcoming.f).length,
    overdue:o.filter(VIEWS.overdue.f).length,done:tasks.filter(t=>t.done).length,
    dueToday:o.filter(t=>t.due&&dayDiff(t.due)===0).length,
    doneToday:tasks.filter(t=>t.done&&t.done.startsWith("Today")).length};
}
function dayProg(){
  const c=counts(), total=c.dueToday+c.doneToday;
  return `<span>Today <b class="num" style="color:var(--text);font-weight:500">${c.doneToday} of ${total}</b> done</span><div class="bar" role="progressbar" aria-label="Today's progress" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${c.doneToday}"><i style="width:${total?c.doneToday/total*100:0}%"></i></div>`;
}
function summaryLine(){
  const c=counts();

}

function subRing(t){
  const n=t.subs.length, d=t.subs.filter(s=>s.d).length, r=5, c=2*Math.PI*r;
  return `<span class="mk" title="${d} of ${n} subtasks done"><svg class="sub-ring" viewBox="0 0 12 12"><circle cx="6" cy="6" r="${r}" fill="none" stroke="var(--control)" stroke-width="1.6"/><circle cx="6" cy="6" r="${r}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="${c*d/n} ${c}" transform="rotate(-90 6 6)"/></svg><span class="num">${d}/${n}</span></span>`;
}
function rowHTML(t,opt={}){
  const dt=dueText(t);

  const drag = route.name==="tasks"&&S.group==="date"&&!t.done;
  return `<div class="row ${t.done&&!t.linger?"done":""} ${t.linger?"done":""} ${S.sel===t.id&&route.name==="tasks"?"sel":""} ${S.kb===t.id?"kb":""} ${drag?"":"nodrag"} ${opt.noProj?"np":""}" role="listitem" data-id="${t.id}" draggable="${drag}">
    <span class="grip" aria-hidden="true">${ico("grip","xs")}</span>
    <button class="ck ${t.pri===3&&!t.done?"p3":""}" data-check="${t.id}" aria-label="${t.done?"Reopen":"Complete"} “${esc(t.title)}”">${ckSvg}</button>
    <button class="tt" data-open="${t.id}"><span class="name">${esc(t.title)}</span></button>
    <div class="meta2">
      <span class="marks">${marks}</span>
      <span class="pcell">${opt.noProj?"":pchip(t.project)}</span>
      <span class="due num ${dt.cls}">${t.done?"Done "+esc(t.done.replace("Today ","")):dt.txt+late}</span>
    </div>
    <span class="pri p${t.pri}" title="${PRI[t.pri]} priority" role="img" aria-label="${PRI[t.pri]} priority"><i></i><i></i><i></i></span>
    ${t.done?"":`<span class="hov">
      <button data-resched="${t.id}" aria-label="Reschedule" title="Reschedule">${ico("cal-arrow")}</button>

    </span>`}
  </div>`;
}
function renderList(){
  const list=visible(), el=document.getElementById("list");
  if(!list.length){
    const msg={overdue:["Nothing overdue","Everything late has a new date."],today:["Today is clear","Nothing due today. Pull something forward from Upcoming."],done:["Nothing completed yet","Finished tasks stay here for 30 days."],upcoming:["Nothing coming up","Tasks with a future date show here."],all:["No open tasks","Add one above, or approve a suggestion."]}[S.view];

      :`<div class="empty"><div class="ok">${ico("check","")}</div><h2>${msg[0]}</h2><p>${msg[1]}</p></div>`;

            ${x.items.length>3?`<div class="more">+${x.items.length-3} more</div>`:""}${x.items.length?"":`<div class="more">Nothing due</div>`}</a>`).join("")}</div></section>
      </div>

/* ======================= calendar ======================= */
function pCalendar(){
  const H0=8,H1=19,PX=48;
  const mon=new Date(TODAY);mon.setDate(mon.getDate()-((mon.getDay()+6)%7)+S.calWeek*7);
  const days=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return iso(d)});
  const label=`${parse(days[0]).getDate()} – ${parse(days[6]).getDate()} ${MO[parse(days[6]).getMonth()]} 2026`;
  const pos=(s,e)=>`top:${(toMin(s)-H0*60)/60*PX+1}px;height:${Math.max(22,(toMin(e)-toMin(s))/60*PX-3)}px`;
  const plus30=hm=>{const m=toMin(hm)+30;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
  const head=`<div class="corner"></div>`+days.map(s=>{const d=parse(s);return `<div class="dh ${dayDiff(s)===0?"td":""}">${WD[d.getDay()]}<b class="num">${d.getDate()}</b></div>`}).join("");
  const allday=`<div class="adl">Due</div>`+days.map(s=>{
    const it=tasks.filter(t=>t.due===s&&!t.time);
    return `<div class="ad">${it.slice(0,3).map(t=>`<a class="adchip ${t.done?"done":dueText(t).cls==="od"?"od":""}" href="#/task/${t.id}" title="${esc(t.title)}"><i class="dot" style="background:var(--t-${PROJECTS[t.project].tone})"></i><span>${esc(t.title)}</span></a>`).join("")}${it.length>3?`<span class="muted" style="font-size:11px;padding-left:4px">+${it.length-3} more</span>`:""}</div>`}).join("");
  const hrs=`<div class="hrs">${[...Array(H1-H0)].map((_,i)=>`<div class="num">${i?String(H0+i).padStart(2,"0")+":00":""}</div>`).join("")}</div>`;
  const cols=days.map(s=>{
    const ev=MEETINGS.filter(m=>m.day===s).map(m=>`<a class="ev meet" href="#" style="${pos(m.s,m.e)}"><b>${esc(m.t)}</b><small class="num">${m.s}–${m.e}</small></a>`).join("");
    const tk=tasks.filter(t=>t.due===s&&t.time&&!t.done).map(t=>`<a class="ev task ${t.pri===3?"hi":""}" href="#/task/${t.id}" style="${pos(t.time,plus30(t.time))}"><b>${esc(t.title)}</b><small class="num">Due ${t.time}</small>${t.rem?`<span class="bell">${ico("bell","xs")}</span>`:""}</a>`).join("");
    const now=dayDiff(s)===0?`<div class="now" style="top:${(NOW_MIN-H0*60)/60*PX}px" aria-label="Now 11:42"></div>`:"";
    return `<div class="dcol ${dayDiff(s)===0?"td":""}" style="height:${(H1-H0)*PX}px">${ev}${tk}${now}</div>`}).join("");
  const agenda=days.map(s=>{
    const items=[...MEETINGS.filter(m=>m.day===s).map(m=>({tm:m.s,html:`<span class="muted num" style="width:44px">${m.s}</span>${ico("video","xs")}<span>${esc(m.t)}</span>`})),
      ...tasks.filter(t=>t.due===s&&isOpen(t)).map(t=>({tm:t.time||"00:00",html:`<span class="num" style="width:44px;color:var(--today)">${t.time||"Due"}</span><i class="dot" style="background:var(--t-${PROJECTS[t.project].tone})"></i><span>${esc(t.title)}</span>`,id:t.id}))].sort((a,b)=>a.tm<b.tm?-1:1);
    return `<div class="gh" style="position:static;padding:0">${longDate(s)}${dayDiff(s)===0?' <span class="pill td" style="height:18px">Today</span>':""}</div>
      ${items.map(x=>`<a class="wl" style="min-height:40px;gap:10px;font-size:13px" href="${x.id?"#/task/"+x.id:"#"}">${x.html}</a>`).join("")||'<p class="muted" style="margin:0 0 8px">Nothing planned</p>'}`}).join("");
  return `<div class="pg">
    <header class="pg-h"><div><h1>Calendar</h1><div class="summary">Tasks with a due time sit in the day; tasks without one sit in the Due row.</div></div>
      <div class="right calbar"><button class="btn sm ic" data-cw="-1" aria-label="Previous week">${ico("chevl")}</button><button class="btn sm" data-cw="0">Today</button><button class="btn sm ic" data-cw="1" aria-label="Next week">${ico("chevr")}</button><span class="wk num">${label}</span>
      <div class="seg"><button aria-pressed="true">Week</button><button aria-pressed="false">Month</button></div></div></header>
    <div style="display:flex;margin:-6px 0 10px"><div class="legend"><span><i style="background:var(--today-bg);border-left:2px solid var(--today)"></i>Task due</span><span><i style="background:var(--warn-bg);border-left:2px solid var(--warn)"></i>High priority</span><span><i style="background:var(--active);border-left:2px solid var(--faint)"></i>Meeting (Google Calendar)</span></div></div>
    <div class="cw">${head}${allday}${hrs}${cols}</div>
    <div class="agenda">${agenda}</div>
  </div>`;
}

function renderNav(){

  document.getElementById("navTasks").textContent=c.all;
  document.getElementById("navInbox").textContent=nIn||"";
  document.getElementById("navInbox").hidden=!nIn;
  document.getElementById("mInbox").textContent=nIn||""; document.getElementById("mInbox").hidden=!nIn;
  document.getElementById("navProjects").innerHTML = Object.entries(PROJECTS).map(([k,p])=>{
    const n=tasks.filter(t=>isOpen(t)&&t.project===k).length;
    return `<a class="nav ${route.name==="projects"&&S.projSel===k?"on":""}" href="#/projects/${k}"><i class="dot" style="background:var(--t-${p.tone})"></i>${p.name}<span class="ct num">${n||""}</span></a>`}).join("");

function render(){
  const tasksPage=route.name==="tasks";
  document.getElementById("sheet").hidden=!tasksPage;
  document.getElementById("other").hidden=tasksPage;
  if(route.name==="projects") S.projSel=route.arg||S.projSel;
  renderNav();
  if(tasksPage){renderHead();renderTray();renderList();renderDetail();return}
  const pages={overview:pOverview,inbox:pInbox,calendar:pCalendar,notes:pNotes,projects:pProjects,settings:pSettings,task:pTask};
  document.getElementById("other").innerHTML=(pages[route.name]||pOverview)();
  document.title="Tether — "+({overview:"Overview",inbox:"Inbox",calendar:"Calendar",notes:"Notes",projects:"Projects",settings:"Settings",task:"Task"}[route.name]||"Overview");
}
/* Routing works by hash in a normal browser, and by script where the hash can't change (previews, data: URLs). */
let hashNow=location.hash;
function go(h){
  hashNow=h;
  try{ if(location.protocol!=="data:") history.pushState(null,"",h); }catch(_){}
  parseRoute(); closePop(); render(); document.getElementById("other").scrollTop=0;
}
function parseRoute(){const h=hashNow.replace(/^#\/?/,"");const [n,a]=h.split("/");route={name:n||"tasks",arg:a?decodeURIComponent(a):null}}
window.addEventListener("popstate",()=>{hashNow=location.hash;parseRoute();closePop();render()});
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#/"]'); if(!a||e.defaultPrevented) return;
  e.preventDefault(); setTimeout(()=>go(a.getAttribute("href")),0);
},true);
Object.defineProperty(window,"nav",{value:go});

/* ======================= actions ======================= */
let undoFn=null, toastTimer;
function toast(msg,undo){
  undoFn=undo; document.getElementById("toastMsg").textContent=msg;
  document.getElementById("toastUndo").style.display=undo?"":"none";
  const el=document.getElementById("toast"); el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),5000);
}
document.getElementById("toastUndo").onclick=()=>{undoFn&&undoFn();undoFn=null;document.getElementById("toast").classList.remove("show");render()};
const trunc=s=>s.length>38?s.slice(0,38)+"…":s;
function toggleDone(id){
  const t=byId(id); const was=t.done;
  if(was){t.done=null;toast("Reopened “"+trunc(t.title)+"”")}
  else {
    t.done="Today 11:42"; t.hist.unshift(["Today 11:42","You completed it"]);
    t.linger=true; setTimeout(()=>{t.linger=false;render()},1400);
    toast("Completed “"+trunc(t.title)+"”",()=>{t.done=was;t.hist.shift()});
  }
  render();
}
function setDue(id,dateIso){
  const t=byId(id), old=[t.due,t.time];
  t.due=dateIso; if(!dateIso) t.time=null;
  if(t.rem&&t.rem.nag&&dateIso&&dayDiff(dateIso)>=0) t.rem.at=dayDiff(dateIso)===0?"Today 09:00":longDate(dateIso)+" 09:00";
  t.hist.unshift(["Today 11:42",dateIso?"You moved it to "+longDate(dateIso):"You removed the date"]);
  toast(dateIso?"Moved to "+dueText(t).txt:"Date removed",()=>{t.due=old[0];t.time=old[1];t.hist.shift()});
  render();
}
function setPri(id,p){byId(id).pri=p;render()}
function newTask(fields){
  const nt={id:Date.now(),project:"home",due:null,time:null,pri:0,src:"manual",rem:null,subs:[],desc:"",links:[],files:[],order:-1,
    hist:[["Today 11:42","You created the task"]],created:"Today, 11:42",updated:"Today, 11:42",...fields};
  tasks.push(nt); return nt;
}

/* ---------- popovers ---------- */
const pop=document.getElementById("pop");
function openPop(anchor,html,bind){
  pop.innerHTML=html; pop.classList.add("show");
  const r=anchor.getBoundingClientRect(), w=pop.offsetWidth, h=pop.offsetHeight;
  let x=Math.min(r.left,innerWidth-w-8), y=r.bottom+6; if(y+h>innerHeight-8) y=r.top-h-6;
  pop.style.left=Math.max(8,x)+"px"; pop.style.top=Math.max(8,y)+"px";
  bind&&bind(pop); pop.querySelector("button,a")?.focus({preventScroll:true});
}
function closePop(){pop.classList.remove("show")}
document.addEventListener("mousedown",e=>{if(!pop.contains(e.target)&&!e.target.closest("[data-resched],[data-prio],[data-more],#groupBtn,#projBtn,[data-projpick]"))closePop()});

let calMonth=10;
function reschedPop(anchor,id){
  const t=byId(id);
  const sat=addDays((6-TODAY.getDay()+7)%7||7), mon=addDays((8-TODAY.getDay())%7||7);
  const opts=[["sun","Today",addDays(0),"Tue"],["sunrise","Tomorrow",addDays(1),"Wed"],["week","This weekend",sat,"Sat"],["cal-arrow","Next week",mon,"Mon"]];
  const cal=()=>{
    const first=new Date(2026,calMonth,1), days=new Date(2026,calMonth+1,0).getDate(), off=(first.getDay()+6)%7;
    let g=["M","T","W","T","F","S","S"].map(x=>`<span>${x}</span>`).join("")+"<span></span>".repeat(off);
    for(let i=1;i<=days;i++){const s=iso(new Date(2026,calMonth,i));const n=dayDiff(s);
      g+=`<button class="${n<0?"past":""} ${n===0?"td":""} ${s===t.due?"cur":""}" data-day="${s}" aria-label="${longDate(s)}">${i}</button>`}
    return `<div class="mh"><button data-cm="-1" aria-label="Previous month">${ico("chevl")}</button>${["January","February","March","April","May","June","July","August","September","October","November","December"][calMonth]} 2026<button data-cm="1" aria-label="Next month">${ico("chevr")}</button></div><div class="g">${g}</div>`;
  };
  const html=()=>opts.map(o=>`<button class="it" data-day="${o[2]}">${ico(o[0])}${o[1]}<small>${o[3]}</small></button>`).join("")
    +`<button class="it" data-day="">${ico("slash")}No date</button><hr><div class="cal">${cal()}</div>
      <hr><button class="it">${ico("clock")}Add a time<small>${t.time||""}</small></button>`;
  openPop(anchor,html(),el=>el.onclick=e=>{
    const cm=e.target.closest("[data-cm]"); if(cm){calMonth=Math.max(10,Math.min(11,calMonth+ +cm.dataset.cm));el.innerHTML=html();return}
    const b=e.target.closest("[data-day]"); if(b){closePop();setDue(id,b.dataset.day||null)}
  });
}
function prioPop(anchor,id){
  const t=byId(id);
  openPop(anchor,[3,2,1,0].map(i=>`<button class="it ${t.pri===i?"on":""}" data-p="${i}"><span class="pri p${i}"><i></i><i></i><i></i></span>${PRI[i]}<small>${i}</small></button>`).join(""),
    el=>el.onclick=e=>{const b=e.target.closest("[data-p]");if(b){closePop();setPri(id,+b.dataset.p)}});
}
function morePop(anchor,id){
  openPop(anchor,`<a class="it" href="#/task/${id}">${ico("expand")}Open full page<small>O</small></a><button class="it">${ico("window")}Open in new window</button><hr><button class="it">${ico("plus")}Add subtask</button><button class="it">${ico("bell")}Set reminder</button><button class="it">${ico("folder")}Move to project</button><button class="it">${ico("dup")}Duplicate</button><button class="it">${ico("notes")}Link a note</button><hr><button class="it" style="color:var(--neg)">${ico("trash")}Delete<small>Restorable for 30 days</small></button>`,
    el=>el.onclick=()=>closePop());
}

  if(b=g("data-edit-s")){const s=suggestions.find(x=>x.id===b.dataset.editS);qa.value=s.title;qa.focus();return}
  if(b=g("data-capok")){

    if(b.dataset.merge){const t=byId(+b.dataset.merge);t.links.push({t:c.page,h:c.host});toast("Added the capture to “"+trunc(t.title)+"”",()=>{t.links.pop();captures.unshift(c)})}
    else {const nt=newTask({title:c.title,project:c.project||"home",due:c.due,src:c.kind==="chrome"?"chrome":"manual",quote:c.quote,links:c.page?[{t:c.page,h:c.host}]:[],hist:[["Today 11:42",c.kind==="chrome"?"Approved from Chrome":"Sorted from Inbox"]]});
      toast("Added to My Tasks",()=>{tasks=tasks.filter(t=>t!==nt);captures.unshift(c)})}
    render();return}
  if(b=g("data-capno")){const c=captures.find(x=>x.id===b.dataset.capno);captures=captures.filter(x=>x!==c);toast("Dismissed",()=>captures.unshift(c));render();return}
  if(b=g("data-capedit")){toast("Edit opens the same fields as a task, before it is added");return}
  if(b=g("data-itab")){S.inboxTab=b.dataset.itab;render();return}

  if(b=g("data-setpri")){setPri(curId(),+b.dataset.setpri);return}

  if(b=g("data-sub")){const t=byId(curId());t.subs[+b.dataset.sub].d=!t.subs[+b.dataset.sub].d;render();return}
  if(b=g("data-subrm")){const t=byId(curId());t.subs.splice(+b.dataset.subrm,1);render();return}

  if(b=g("data-remoff")){const t=byId(curId()),old=t.rem;t.rem=null;toast("Reminder removed",()=>t.rem=old);render();return}

const qa=document.getElementById("qa");
function parseQA(s){
  const r={title:s,due:null,time:null,pri:0,project:null};
  const pm=s.match(/#(\w+)/); if(pm){const k=Object.keys(PROJECTS).find(k=>k.startsWith(pm[1].toLowerCase())||PROJECTS[k].name.toLowerCase().startsWith(pm[1].toLowerCase()));if(k)r.project=k}
  const pr=s.match(/!(high|med|medium|low|[123])/i); if(pr){const v=pr[1].toLowerCase();r.pri={high:3,"3":3,med:2,medium:2,"2":2,low:1,"1":1}[v]}
  const tm=s.match(/\b(\d{1,2})(?::(\d\d))?\s*(am|pm)\b/i); if(tm){let h=+tm[1]%12+(tm[3].toLowerCase()==="pm"?12:0);r.time=String(h).padStart(2,"0")+":"+(tm[2]||"00")}
  if(/\btoday\b/i.test(s))r.due=addDays(0); else if(/\b(tomorrow|tmrw)\b/i.test(s))r.due=addDays(1);
  else {const m=s.match(/\b(mon|tue|wed|thu|fri|sat|sun)[a-z]*\b/i); if(m){const wd=["sun","mon","tue","wed","thu","fri","sat"].indexOf(m[1].toLowerCase());r.due=addDays(((wd-TODAY.getDay()+7)%7)||7)}}
  r.title=s.replace(/#\w+|!\w+|\b\d{1,2}(:\d\d)?\s*(am|pm)\b|\b(today|tomorrow|tmrw|(mon|tue|wed|thu|fri|sat|sun)[a-z]*)\b/gi,"").replace(/\s+/g," ").trim();
  return r;
}
qa.addEventListener("input",()=>{
  const r=parseQA(qa.value), el=document.getElementById("parse");
  if(!qa.value.trim()){el.innerHTML="";return}
  el.innerHTML=(r.due?`<span class="pill td">${ico("cal","xs")} ${dueText({due:r.due,time:r.time}).txt}</span>`:"")
   +(r.project?`<span class="chip" style="${toneStyle(PROJECTS[r.project].tone)}">${PROJECTS[r.project].name}</span>`:"")
   +(r.pri?`<span class="pill ${r.pri===3?"wn":""}">${PRI[r.pri]}</span>`:"");
});
qa.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&qa.value.trim()){
    const r=parseQA(qa.value);
    const nt=newTask({title:r.title||qa.value,project:r.project||"home",due:r.due,time:r.time,pri:r.pri});
    S.sel=nt.id;qa.value="";document.getElementById("parse").innerHTML="";toast("Task added",()=>{tasks=tasks.filter(t=>t!==nt)});render();
  }
  if(e.key==="Escape"){qa.blur()}
});

/* keyboard: j/k move, x complete, t/m reschedule, 1-3 priority, enter details, o full page, esc close */
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();document.getElementById("q").focus();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="n"){e.preventDefault();document.getElementById("newBtn").click();return}
  if(e.target.matches("input,textarea,select,[contenteditable=true]"))return;
  if(e.key==="Escape"){if(pop.classList.contains("show"))closePop();else if(route.name==="task")go("#/tasks");else{S.sel=null;render()}return}
  if(route.name!=="tasks")return;
  const ids=[...document.querySelectorAll("#list .row")].map(r=>+r.dataset.id);
  const cur=S.kb??S.sel; let i=ids.indexOf(cur);
  const k=e.key.toLowerCase();
  if(k==="j"||e.key==="ArrowDown"){e.preventDefault();S.kb=ids[Math.min(ids.length-1,i+1)];if(S.sel)S.sel=S.kb;render();scrollKb()}
  else if(k==="k"||e.key==="ArrowUp"){e.preventDefault();S.kb=ids[Math.max(0,i-1)];if(S.sel)S.sel=S.kb;render();scrollKb()}
  else if(!cur) return;
  else if(e.key==="Enter"){S.sel=cur;render()}
  else if(k==="o"){go("#/task/"+cur)}
  else if(k==="x"){toggleDone(cur)}
  else if(k==="t"){setDue(cur,iso(TODAY))}
  else if(k==="m"){setDue(cur,addDays(1))}
  else if(["0","1","2","3"].includes(k)){setPri(cur,+k)}
});
function scrollKb(){document.querySelector(".row.kb")?.scrollIntoView({block:"nearest"})}

/* drag to reorder inside a date group */
let dragId=null;
document.addEventListener("dragstart",e=>{const r=e.target.closest?.(".row");if(!r)return;dragId=+r.dataset.id;r.classList.add("dragging");e.dataTransfer.effectAllowed="move"});
document.addEventListener("dragend",()=>{document.querySelectorAll(".dragging,.over").forEach(x=>x.classList.remove("dragging","over"));dragId=null});
document.addEventListener("dragover",e=>{const r=e.target.closest?.(".row");if(!r||dragId==null)return;
  const a=byId(dragId),b=byId(+r.dataset.id);if(dateBucket(a)[0]!==dateBucket(b)[0])return;
  e.preventDefault();document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));r.classList.add("over")});
document.addEventListener("drop",e=>{const r=e.target.closest?.(".row");if(!r||dragId==null)return;e.preventDefault();
  const a=byId(dragId),b=byId(+r.dataset.id);if(a===b)return;
  const list=tasks.slice().sort((x,y)=>x.order-y.order).filter(t=>t!==a);list.splice(list.indexOf(b),0,a);list.forEach((t,i)=>t.order=i);render()});

if(matchMedia("(max-width:720px)").matches) qa.placeholder="Add a task";
parseRoute();
render();
</script>
