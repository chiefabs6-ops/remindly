<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tether</title>
    <link rel="stylesheet" href="./src/popup.css" />
  </head>
  <body>
    <header>
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="7.5" cy="10" r="5" fill="none" stroke="currentColor" stroke-width="2" />
        <circle cx="12.5" cy="10" r="5" fill="none" stroke="#1d5fbf" stroke-width="2" />
      </svg>
      <strong>Tether</strong>
      <span id="state" class="state" role="status"></span>
    </header>

    <section id="pair" hidden>
      <h1>Pair with Tether</h1>
      <p class="muted">In Tether, open Settings → Chrome and press <b>Pair Chrome</b>. Type the 6-digit code here.</p>
      <form id="pair-form">
        <label for="code">Pairing code</label>
        <input id="code" inputmode="numeric" autocomplete="off" maxlength="6" pattern="[0-9]{6}" required />
        <button class="primary" type="submit">Pair</button>
      </form>
    </section>

    <section id="main" hidden>
      <form id="quick-form">
        <label for="quick">Quick capture</label>
        <textarea id="quick" rows="3" placeholder="Call the venue friday 3pm"></textarea>
        <div class="row">
          <button class="primary" type="submit" data-kind="task">Add task</button>
          <button type="button" id="as-note">Save as note</button>
        </div>
      </form>

      <div class="row between">
        <h2>Recent captures</h2>
        <span id="pending" class="muted"></span>
      </div>
      <ul id="recent"></ul>

      <div class="row">
        <button type="button" id="open">Open Tether</button>
        <button type="button" id="retry" hidden>Send waiting items</button>
        <button type="button" id="unpair" class="link">Unpair</button>
      </div>
    </section>
    <p id="msg" class="msg" role="alert"></p>
    <script type="module" src="./src/popup.ts"></script>
  </body>
</html>
